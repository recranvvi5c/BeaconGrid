<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-label="BeaconGrid replay flow">
  <title>BeaconGrid replay flow</title>
  <desc>Animated pipeline: a recorded session and revised policy flow through the replay engine to produce a dossier with deltas, divergence, and coverage.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14324f"/>
      <stop offset="1" stop-color="#0e2438"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6fb8"/>
      <stop offset="1" stop-color="#2aa7d6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5cd1ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="260" rx="14" fill="#0a1a2b"/>

  <!-- inputs -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="24" y="48" width="150" height="60" rx="10" fill="url(#panel)" stroke="#2f6690"/>
      <text x="99" y="74" font-size="15" font-weight="600" fill="#eaf6ff">Recorded</text>
      <text x="99" y="94" font-size="15" font-weight="600" fill="#eaf6ff">Session</text>
    </g>
    <g>
      <rect x="24" y="150" width="150" height="60" rx="10" fill="url(#panel)" stroke="#2f6690"/>
      <text x="99" y="176" font-size="15" font-weight="600" fill="#eaf6ff">Revised</text>
      <text x="99" y="196" font-size="15" font-weight="600" fill="#eaf6ff">Policy</text>
