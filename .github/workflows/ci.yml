name: verify

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m compileall -q beacongrid
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - run: go build ./...
        working-directory: grid
